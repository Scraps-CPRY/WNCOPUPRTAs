name: feed
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: feed
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          git config user.name feedbot
          git config user.email feedbot@users.noreply.github.com
          python scrape.py --minutes 340 --interval 180

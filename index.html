<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Femdom JOI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0b0f14; color: #d7d7d7; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px 12px 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; }
  h1 { font-size: 17px; font-weight: 500; margin: 0; }
  .sub { font-size: 11.5px; opacity: .6; }
  .btn { border: 1px solid #2b3440; background: #141a22; color: inherit; font: inherit; font-size: 12.5px; padding: 8px 12px; border-radius: 9px; cursor: pointer; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .filters .wide { grid-column: 1 / -1; }
  input, select { background: #141a22; border: 1px solid #2b3440; color: inherit; border-radius: 9px; padding: 9px 11px; font: inherit; font-size: 13px; min-width: 0; width: 100%; }
  .stats { font-size: 11.5px; opacity: .55; margin: 8px 0 12px; display: flex; justify-content: space-between; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .card { display: block; text-decoration: none; color: inherit; border-radius: 12px; overflow: hidden; background: #10161d; border: 1px solid #1d2530; }
  .card:active { border-color: #2563eb; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #161d25; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { padding: 8px 9px 10px; }
  .t { font-size: 12.5px; line-height: 1.35; margin: 0 0 5px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { font-size: 10.5px; opacity: .5; display: flex; gap: 6px; flex-wrap: wrap; }
  .more { width: 100%; padding: 13px; border-radius: 11px; border: 1px dashed #2b3440; background: transparent; color: inherit; font: inherit; font-size: 13px; margin-top: 16px; }
  .more[hidden] { display: none; }
  .empty { text-align: center; padding: 40px 12px; opacity: .55; font-size: 13px; }
  .err { border: 1px solid #7f1d1d; background: #1b1215; border-radius: 9px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; }
  .foot { font-size: 10.5px; opacity: .35; text-align: center; padding-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Femdom JOI</h1><div class="sub" id="status">cargando…</div></div>
    <button class="btn" id="refresh">Actualizar</button>
  </div>
  <div class="filters">
    <input class="wide" id="q" placeholder="Buscar palabras del título…">
    <input id="perf" placeholder="Performer">
    <select id="type"><option value="">Todo tipo</option></select>
    <select id="cat"><option value="">Toda categoría</option></select>
    <label style="font-size:12.5px;opacity:.8;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="fuzzy" checked style="width:auto"> Tolerar errores de tipeo
    </label>
  </div>
  <div class="stats"><span id="stats"></span><span id="load"></span></div>
  <div class="grid" id="feed"></div>
  <button class="more" id="more" hidden>Cargar más</button>
  <div class="foot">Datos de femdom-joi.com · ordenado de nuevo a viejo</div>
</div>
<script>
const BASE = "";
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let all = [], seen = new Set(), shown = 60, tokCache = new Map();

function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

function tokens(it) {
  if (tokCache.has(it.id)) return tokCache.get(it.id);
  const t = new Set((norm(it.title) + " " + norm(it.performer) + " " + norm(it.type) + " " + (it.cats || []).join(" ") + " " + (it.cat || "")).split(/[^a-z0-9]+/).filter(Boolean));
  tokCache.set(it.id, t);
  return t;
}

function dist(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  const prev = new Array(b.length + 1), cur = new Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) prev[j] = j;
  for (let i = 1; i <= a.length; i++) {
    cur[0] = i;
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
  }
  return prev[b.length];
}

function wordHit(tk, w, fuzzy) {
  for (const t of tk) {
    if (t === w || t.startsWith(w)) return true;
  }
  if (!fuzzy || w.length < 4) return false;
  const max = w.length >= 8 ? 2 : 1;
  for (const t of tk) if (dist(w, t, max) <= max) return true;
  return false;
}

function matches(it, words, perf, type, cat, fuzzy) {
  if (type && it.type !== type) return false;
  if (cat && !(it.cats || []).includes(cat)) return false;
  const tk = tokens(it);
  if (perf) {
    const p = norm(it.performer);
    if (!p.includes(perf) && !wordHit(tk, perf, fuzzy)) return false;
  }
  for (const w of words) if (!wordHit(tk, w, fuzzy)) return false;
  return true;
}

function list() {
  const words = norm($("q").value).split(/[^a-z0-9]+/).filter(Boolean);
  const perf = norm($("perf").value).trim();
  const type = $("type").value, cat = $("cat").value, fuzzy = $("fuzzy").checked;
  if (!words.length && !perf && !type && !cat) return all;
  return all.filter((it) => matches(it, words, perf, type, cat, fuzzy));
}

function render(reset) {
  if (reset) shown = 60;
  const l = list();
  $("stats").textContent = l.length + " de " + all.length;
  const s = l.slice(0, shown);
  $("feed").innerHTML = s.length ? s.map(card).join("") : '<div class="empty">Nada coincide.</div>';
  $("more").hidden = l.length <= shown;
}

function card(it) {
  return '<a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
    '<div class="thumb"><img loading="lazy" src="' + esc(it.img) + '" alt="" onerror="this.style.display=\'none\'"></div>' +
    '<div class="meta"><p class="t">' + esc(it.title) + '</p><div class="tags">' +
    (it.type ? '<span>' + esc(it.type) + '</span>' : '') +
    (it.performer ? '<span>' + esc(it.performer) + '</span>' : '') +
    '<span>' + new Date(it.ts * 1000).toLocaleDateString("es-PR", { day: "2-digit", month: "short", year: "2-digit" }) + '</span>' +
    '</div></div></a>';
}

async function loadFile(url) {
  try {
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return [];
    const t = await r.text();
    if (url.endsWith(".jsonl")) return t.split("\n").filter(Boolean).map((l) => JSON.parse(l));
    const j = JSON.parse(t);
    return Array.isArray(j) ? j : [];
  } catch (e) { return []; }
}

async function load() {
  $("status").textContent = "leyendo…";
  try {
    const parts = await Promise.all([loadFile("index.json"), loadFile("arc.jsonl")]);
    const merged = [];
    seen = new Set();
    for (const arr of parts) for (const it of arr) if (it && it.id && !seen.has(it.id)) { seen.add(it.id); merged.push(it); }
    if (!merged.length) throw new Error("sin datos todavía");
    all = merged.sort((a, b) => b.ts - a.ts);
    const types = [...new Set(all.map((x) => x.type).filter(Boolean))].sort();
    const cats = [...new Set(all.flatMap((x) => x.cats || []))].sort();
    const ts = $("type"), cs = $("cat");
    types.forEach((t) => { const o = document.createElement("option"); o.value = t; o.textContent = t; ts.appendChild(o); });
    cats.forEach((c) => { const o = document.createElement("option"); o.value = c; o.textContent = c.replace(/-/g, " "); cs.appendChild(o); });
    $("status").textContent = "actualizado " + new Date().toLocaleTimeString("es-PR", { hour: "2-digit", minute: "2-digit" });
    render(true);
  } catch (e) {
    $("status").textContent = "error";
    $("feed").innerHTML = '<div class="err">No pude leer los datos (' + esc(e.message) + ').</div>';
  }
}

$("feed").addEventListener("click", (e) => { if (e.target.tagName !== "IMG") { const c = e.target.closest(".card"); if (c) window.open(c.href, "_blank"); } });
let deb;
["q", "perf", "type", "cat", "fuzzy"].forEach((i) => $(i).addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(() => render(true), 160); }));
$("more").onclick = () => { shown += 60; render(); };
$("refresh").onclick = load;
load();
</script>
</body>
</html>

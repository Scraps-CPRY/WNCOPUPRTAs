<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Contactos PR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0b0f14; color: #d7d7d7; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 60px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #2563eb; color: #fff; font-size: 12px; font-weight: 600; }
  h1 { font-size: 16px; font-weight: 500; margin: 0; }
  .sub { font-size: 11.5px; opacity: .6; }
  .btn { border: 1px solid #2b3440; background: #141a22; color: inherit; font: inherit; font-size: 12.5px; padding: 8px 12px; border-radius: 9px; cursor: pointer; }
  .btn:active { background: #1d2630; }
  .filters { display: flex; gap: 6px; margin-bottom: 8px; }
  input, select { background: #141a22; border: 1px solid #2b3440; color: inherit; border-radius: 9px; padding: 9px 11px; font: inherit; font-size: 13px; min-width: 0; }
  #q { flex: 1; }
  .row2 { display: flex; gap: 14px; margin-bottom: 10px; font-size: 12.5px; opacity: .85; }
  .chk { display: inline-flex; align-items: center; gap: 6px; }
  .stats { font-size: 11.5px; opacity: .55; margin-bottom: 12px; }
  .post { border: 1px solid #232c36; border-radius: 13px; overflow: hidden; margin-bottom: 14px; background: #10161d; }
  .ph { position: relative; background: #161d25; }
  .strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip > img { width: 100%; flex: 0 0 100%; scroll-snap-align: start; max-height: 440px; object-fit: cover; display: block; }
  .post.zoom .strip > img { max-height: none; object-fit: contain; }
  .ph.noimg { height: 70px; display: grid; place-items: center; font-size: 12px; opacity: .5; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 99px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 17px; cursor: pointer; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; } .nav[hidden] { display: none; }
  .cnt { position: absolute; top: 9px; right: 9px; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.65); color: #fff; }
  .bdg { position: absolute; top: 9px; left: 9px; font-size: 10.5px; padding: 2px 8px; border-radius: 99px; background: #2563eb; color: #fff; }
  .body { padding: 11px 13px 13px; }
  .t { font-size: 14px; font-weight: 500; margin: 0 0 5px; }
  .meta { font-size: 11px; opacity: .55; margin-bottom: 7px; display: flex; gap: 8px; flex-wrap: wrap; }
  .desc { font-size: 13px; opacity: .82; margin: 0 0 11px; white-space: pre-wrap; }
  .acts { display: flex; gap: 7px; flex-wrap: wrap; }
  .acts a, .acts button { font-size: 12px; padding: 7px 11px; border-radius: 8px; text-decoration: none; border: 1px solid #2b3440; background: #141a22; color: inherit; cursor: pointer; font-family: inherit; }
  .acts .dl { border-color: #1d4ed8; color: #7aa7ff; }
  .more { width: 100%; padding: 13px; border-radius: 11px; border: 1px dashed #2b3440; background: transparent; color: inherit; font: inherit; font-size: 13px; }
  .more[hidden] { display: none; }
  .empty { text-align: center; padding: 34px 12px; opacity: .55; font-size: 13px; }
  .err { border: 1px solid #7f1d1d; background: #1b1215; border-radius: 9px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; }
  .foot { font-size: 10.5px; opacity: .35; text-align: center; padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="mark">CP</div><div><h1>Contactos PR</h1><div class="sub" id="status">—</div></div></div>
    <button class="btn" id="refresh">Actualizar</button>
  </div>
  <div class="filters">
    <input id="q" placeholder="Buscar…">
    <select id="cat"><option value="">Todas</option></select>
  </div>
  <div class="row2">
    <label class="chk"><input type="checkbox" id="fVer"> Verificada</label>
    <label class="chk"><input type="checkbox" id="fImg" checked> Con foto</label>
  </div>
  <div class="stats" id="stats"></div>
  <div id="feed"></div>
  <button class="more" id="more" hidden>Cargar más</button>
  <div class="foot">Datos de wanuncios.com · servidos por jsDelivr</div>
</div>
<script>
const BASE = "https://cdn.jsdelivr.net/gh/Scraps-CPRY/WNCOPUPRTAs@main";
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let all = [], shown = 40;

async function load() {
  $("status").textContent = "leyendo…";
  try {
    const r = await fetch(BASE + "/index.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    all = (await r.json()).sort((a, b) => b.ts - a.ts);
    $("status").textContent = "actualizado " + new Date().toLocaleTimeString("es-PR", { hour: "2-digit", minute: "2-digit" });
    render(true);
  } catch (e) {
    $("status").textContent = "error";
    $("feed").innerHTML = '<div class="err">No pude leer los datos (' + esc(e.message) + '). Espera unos minutos y pulsa Actualizar.</div>' + $("feed").innerHTML;
  }
}

function list() {
  const q = $("q").value.trim().toLowerCase(), c = $("cat").value, v = $("fVer").checked, i = $("fImg").checked;
  return all.filter((x) => (!c || x.cat === c) && (!v || x.verified) && (!i || (x.photos || []).length) &&
    (!q || (x.title + " " + x.desc + " " + x.loc).toLowerCase().includes(q)));
}

function render(reset) {
  if (reset) shown = 40;
  const sel = $("cat");
  [...new Set(all.map((x) => x.cat))].forEach((c) => {
    if (![...sel.options].some((o) => o.value === c)) {
      const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o);
    }
  });
  const l = list();
  $("stats").textContent = all.length + " anuncios · " + l.length + " con estos filtros";
  const s = l.slice(0, shown);
  $("feed").innerHTML = s.length ? s.map(card).join("") : '<div class="empty">Nada con estos filtros.</div>';
  $("more").hidden = l.length <= shown;
}

function card(it) {
  const ph = (it.photos || []).map((p) => BASE + "/" + p);
  const m = ph.length > 1;
  return '<article class="post" data-id="' + esc(it.id) + '">' +
    (ph.length
      ? '<div class="ph"><div class="strip" data-strip>' + ph.map((u) => '<img loading="lazy" src="' + esc(u) + '" alt="">').join("") + '</div>' +
        (m ? '<button class="nav prev" data-nav="-1" hidden>‹</button><button class="nav next" data-nav="1">›</button><span class="cnt">1/' + ph.length + '</span>' : '') +
        (it.verified ? '<span class="bdg">verificada</span>' : '') + '</div>'
      : '<div class="ph noimg">sin imagen</div>') +
    '<div class="body"><h3 class="t">' + esc(it.title || it.loc || "Anuncio") + '</h3>' +
    '<div class="meta">' + (it.loc ? '<span>' + esc(it.loc) + '</span>' : '') + '<span>' + esc(it.cat) + '</span><span>' +
    new Date(it.ts * 1000).toLocaleString("es-PR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) + '</span></div>' +
    (it.desc ? '<p class="desc">' + esc(it.desc) + '</p>' : '') +
    '<div class="acts"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">Ver anuncio</a>' +
    (ph.length ? '<button class="dl" data-dl="' + esc(it.id) + '">Descargar foto</button>' : '') +
    (m ? '<button data-all="' + esc(it.id) + '">Descargar las ' + ph.length + '</button>' : '') +
    '</div></div></article>';
}

async function save(url, name) {
  try {
    const r = await fetch(url);
    const b = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  } catch (e) { window.open(url, "_blank"); }
}

$("feed").addEventListener("click", (e) => {
  const n = e.target.closest("[data-nav]");
  if (n) { const s = n.parentNode.querySelector("[data-strip]"); s.scrollBy({ left: s.clientWidth * +n.dataset.nav, behavior: "smooth" }); return; }
  const im = e.target.closest(".strip > img");
  if (im) { im.closest(".post").classList.toggle("zoom"); return; }
  const d = e.target.closest("[data-dl]");
  if (d) {
    const o = all.find((x) => x.id === d.dataset.dl), s = d.closest(".post").querySelector("[data-strip]");
    const i = s ? Math.round(s.scrollLeft / Math.max(1, s.clientWidth)) : 0;
    if (o?.photos?.[i]) save(BASE + "/" + o.photos[i], "wanuncios-" + o.id + "-" + (i + 1) + ".jpg");
    return;
  }
  const a = e.target.closest("[data-all]");
  if (a) { const o = all.find((x) => x.id === a.dataset.all); (o.photos || []).forEach((p, i) => setTimeout(() => save(BASE + "/" + p, "wanuncios-" + o.id + "-" + (i + 1) + ".jpg"), i * 500)); }
});

$("feed").addEventListener("scroll", (e) => {
  const s = e.target.closest?.("[data-strip]"); if (!s) return;
  const p = s.closest(".post"), n = s.children.length, i = Math.min(n, Math.round(s.scrollLeft / Math.max(1, s.clientWidth)) + 1);
  const c = p.querySelector(".cnt"); if (c) c.textContent = i + "/" + n;
  p.querySelector(".nav.prev").hidden = i <= 1;
  p.querySelector(".nav.next").hidden = i >= n;
}, true);

$("refresh").onclick = load;
$("more").onclick = () => { shown += 40; render(); };
["q", "cat", "fVer", "fImg"].forEach((i) => $(i).addEventListener("input", () => render(true)));
load();
setInterval(load, 180000);
</script>
</body>
</html>
